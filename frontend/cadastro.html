    <section class="register-page">

        <div class="register-container">


            <div class="register-left">

                <h1>
                    Crie sua conta e <br>
                    comece a usar <br>
                    a <span>Glídia</span>
                </h1>

                <div class="login-image">

                    <div class="circle one"></div>
                    <div class="circle two"></div>
                    <div class="circle three"></div>

                    <img src="./imgs/ceguinho-removebg-preview 1.png"
                         data-light="./imgs/ceguinho-removebg-preview 1.png"
                         data-dark="./imgs/bengalinha-removebg-preview 1.png"
                         alt="Pessoa utilizando bengala">

                </div>

            </div>
        
            <div class="register-card">

                <h2>Cadastro</h2>

                <form id="registerForm">


                    <div class="input-group">

                        <label>Nome completo</label>

                        <input
                            id="nome"
                            type="text"
                            placeholder="Digite seu nome">

                    </div>


                    <div class="input-group">

                        <label>E-mail</label>

                        <input
                            id="email"
                            type="email"
                            placeholder="Digite seu e-mail">

                    </div>


                    <div class="input-group">

                        <label>Senha</label>

                        <div class="password-box">

                            <input
                                id="password"
                                type="password"
                                placeholder="Digite sua senha">

                            <span id="togglePassword">

                                <i class="fa-regular fa-eye-slash"></i>

                            </span>

                        </div>

                    </div>


                    <div class="input-group">

                        <label>Confirmar senha</label>

                        <div class="password-box">

                            <input
                                id="confirmPassword"
                                type="password"
                                placeholder="Confirme sua senha">

                            <span id="toggleConfirmPassword">

                                <i class="fa-regular fa-eye-slash"></i>

                            </span>

                        </div>

                    </div>

                    <!-- CONTATO DE EMERGÊNCIA -->

                    <div class="divider">

                    <span></span>

                    <p>Contato de Emergência</p>

                    <span></span>

                    </div>


                    <!-- TELEFONE DO CONTATO -->

                    <div class="input-group">


                    <label for="telefoneEmergencia">

                    Telefone

                    </label>



                    <input

                    id="telefoneEmergencia"

                    type="tel"

                    placeholder="(11) 99999-9999"

                    maxlength="15"

                    required>


                    </div>


                    <button type="submit" class="register-btn">

                        Cadastrar

                    </button>


                    <div class="divider">

                        <span></span>

                        <p>ou</p>

                        <span></span>

                    </div>

                    <!-- Google -->

                    <button
                        type="button"
                        class="google-btn">

                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg">

                        Cadastrar com Google

                    </button>


                    <p class="login-link">

                        Já tenho uma conta ?

                        <a href="login.html">

                            Entrar

                        </a>

                    </p>

                </form>

            </div>

        </div>

    </section>
